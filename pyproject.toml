[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fugitive-strategy"
version = "0.1.0"
description = "Teaching framework for strategy research in the Fugitive card game"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Fugitive course project" },
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fugitive = "fugitive.web.server:main"
fugitive-web = "fugitive.web.server:main"
fugitive-psro = "fugitive.psro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fugitive.web" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]
